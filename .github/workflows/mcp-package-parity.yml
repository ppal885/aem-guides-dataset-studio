name: MCP package parity

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  mcp-client-zip-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify current MCP client ZIPs match unpacked sources
        run: python scripts/package_mcp_client_bundles.py --check
