# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    - name: Lint with flake8
      run: |
        cd backend
        # stop the build if there are Python syntax errors or undefined names
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  pytest:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.txt

    - name: Test with pytest
      env:
        # backend/ for the app package, the repo root for mcp_server.py
        PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      run: |
        cd backend
        # These tests load the MCP servers (mcp_server.py, mcp_server/server.py, the release clients), whose MCP SDK
        # needs anyio>=4.5 and cannot share an environment with the pinned FastAPI; the mcp-server job runs them.
        pytest tests/ -v --tb=short \
          --ignore=tests/test_ask_dita_expert_fast_path.py \
          --ignore=tests/test_shared_uac_feedback_client_contracts.py \
          --deselect=tests/test_qe_pattern_mcp_interfaces.py::test_claude_desktop_server_redacts_backend_validation_details

  mcp-server:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install MCP server dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest python-dotenv structlog fastapi -r requirements-mcp.txt

    - name: Test the MCP servers in their own environment
      env:
        PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      run: >-
        python -m pytest --noconftest -v
        backend/tests/test_ask_dita_expert_fast_path.py
        backend/tests/test_shared_uac_feedback_client_contracts.py
        backend/tests/test_qe_pattern_mcp_interfaces.py::test_claude_desktop_server_redacts_backend_validation_details
