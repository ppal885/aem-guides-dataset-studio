environment:
  base_url: "https://author-p34572-e147958.adobeaemcloud.com/"
  deployment_model: cloud

authentication:
  username_env: AEM_USERNAME
  password_env: AEM_PASSWORD
  storage_state: ui_evidence/auth/storage_state.json

browser:
  type: chromium
  headed: true
  viewport:
    width: 1536
    height: 960

crawler:
  mode: smoke
  max_states: 30
  max_depth: 4
  max_actions_per_state: 12
  max_dialog_states: 40
  navigation_timeout_ms: 20000
  overall_timeout_s: 1800
  mutation_mode: false

# Action safety policy (merged with built-in defaults; defaults always block
# destructive tokens even if omitted here).
action_policy:
  safe_action_patterns:
    - open
    - close
    - expand
    - collapse
    - switch
    - preview
    - filter
    - properties
  blocked_action_patterns:
    - delete
    - move
    - rename
    - publish
    - upload
    - save
    - create
    - check_in
    - reprocess
    - submit
  safe_selectors: []
  blocked_selectors: []

# Execution-context only. Fixture VALUES are never ingested as product knowledge.
fixtures:
  root: ""
  dita_topic: ""
  dita_map: ""
  ditaval: ""
  image: ""
  multimedia: ""
  topic_with_keys: ""
  root_map_with_keys: ""
  collection: ""
  # The most reliable way into the New Editor surfaces: open a DITA topic/map in
  # the Guides web editor in your browser and paste the FULL url here.
  editor_url: ""
  # Optional: a URL template with {path}; combined with dita_map/dita_topic above
  # to build editor deep links. Example (confirm your deployment's pattern):
  #   "https://author-p34572-e147958.adobeaemcloud.com/ui#/aem/editor.html{path}"
  editor_url_template: ""

# Entry points that take the crawler INTO Guides (the AEM author root alone lands
# on the Start page). Paths are relative to base_url; the crawler discovers the
# rest from here. The Assets UI is where Guides content lives.
seed_surfaces:
  - "assets.html/content/dam"

output:
  directory: ui_evidence
