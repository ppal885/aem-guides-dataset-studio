environment:
  base_url: "https://author-p34572-e147958.adobeaemcloud.com/"
  deployment_model: cloud

authentication:
  username_env: AEM_USERNAME
  password_env: AEM_PASSWORD
  storage_state: ui_evidence/auth/storage_state.json

browser:
  type: chromium
  headed: true
  viewport:
    width: 1536
    height: 960

crawler:
  mode: smoke
  max_states: 30
  max_depth: 4
  max_actions_per_state: 12
  max_dialog_states: 40
  navigation_timeout_ms: 20000
  overall_timeout_s: 1800
  mutation_mode: false

# Action safety policy (merged with built-in defaults; defaults always block
# destructive tokens even if omitted here).
action_policy:
  safe_action_patterns:
    - open
    - close
    - expand
    - collapse
    - switch
    - preview
    - filter
    - properties
    # Guides editor left-nav panels + editor modes (read-only navigation)
    - collections
    - explorer
    - map
    - outline
    - conditions
    - more
    - author
    - source
    - side_by_side
    - overview
  blocked_action_patterns:
    - delete
    - move
    - rename
    - publish
    - upload
    - save
    - create
    - check_in
    - reprocess
    - submit
  safe_selectors: []
  blocked_selectors: []

# Execution-context only. Fixture VALUES are never ingested as product knowledge.
fixtures:
  root: ""
  dita_topic: ""    # repo path of a topic to open in the editor, e.g. /content/dam/<folder>/<topic>.dita
  dita_map: ""
  ditaval: ""
  image: ""
  multimedia: ""
  topic_with_keys: ""
  root_map_with_keys: ""
  collection: ""
  # Host-agnostic editor deep-link template (good practice: no env/topic-specific
  # URL is hardcoded). Placeholders: {base}=base_url, {path}=repo path,
  # {path_enc}=url-encoded path. Combined with the dita_topic/dita_map path above.
  editor_url_template: "{base}/libs/fmdita/clientlibs/xmleditor/page.html?appMode=author&src={path_enc}"
  # Escape hatch (discouraged): a full, environment-specific editor URL.
  editor_url: ""

# Entry points that take the crawler INTO Guides (the AEM author root alone lands
# on the Start page). Paths are relative to base_url; the crawler discovers the
# rest from here. The Assets UI is where Guides content lives.
seed_surfaces:
  - "assets.html/content/dam"
  # NOTE: the Guides web editor only opens with a topic loaded (a src=<path>
  # param). An editor URL WITHOUT src redirects to /aem/search.html, so the
  # editor entry is provided via fixtures.editor_url above (paste the FULL url of
  # a topic open in your editor), not as a bare shell seed here.

output:
  directory: ui_evidence
