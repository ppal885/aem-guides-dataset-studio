services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aem-studio-backend
    env_file: .env.docker
    environment:
      - PORT=8001
      - ALLOW_DEV_AUTH_BYPASS=${ALLOW_DEV_AUTH_BYPASS:-true}
    ports:
      - "8001:8001"
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - studio-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=
    container_name: aem-studio-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - studio-net

volumes:
  backend_storage:
    driver: local
  backend_logs:
    driver: local

networks:
  studio-net:
    driver: bridge
